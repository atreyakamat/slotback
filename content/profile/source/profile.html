<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="glass.css"><style>
.cov{position:absolute;left:0;top:420px;width:1080px;height:1080px;display:flex;align-items:center;justify-content:center}
.disc{width:640px;height:640px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.disc svg{width:400px;height:400px}
.lab{position:absolute;left:0;right:0;top:1560px;text-align:center;font-family:AB;font-size:64px;letter-spacing:-.02em;opacity:.0}
.post{position:absolute;inset:0;padding:110px 96px 96px;display:flex;flex-direction:column}
</style><script src="logo.js"></script></head><body><div id="bg"></div><div id="root"></div>
<script>
const q=new URLSearchParams(location.search),mode=q.get('m'),i=+q.get('i');
const W=1080,H=mode==='cover'?1920:1350;document.body.style.width=W+'px';document.body.style.height=H+'px';
// background
let r=(i+3)*7919;const rnd=()=>((r=(r*9301+49297)%233280)/233280);
let h='<div class="gridl"></div>';
for(let k=0;k<6;k++){const s=500+rnd()*500;const col=['rgba(198,244,50,.42)','rgba(26,68,52,.95)','rgba(40,120,80,.6)','rgba(198,244,50,.22)','rgba(15,80,60,.8)'][Math.floor(rnd()*5)];
 h+=`<div class="blob" style="left:${rnd()*W-250}px;top:${rnd()*H-250}px;width:${s}px;height:${s}px;background:${col}"></div>`}
h+='<div class="noise"></div>';document.getElementById('bg').innerHTML=h;
const S=(d,extra='')=>`<svg viewBox="0 0 100 100" fill="none" stroke="#C6F432" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const ICONS={
 how:S('<path d="M78 38a31 31 0 1 0 3 20"/><path d="M82 20v20H62"/><path d="M38 50l8 8 16-16"/>'),
 faq:S('<path d="M18 24h64v42H46L30 80V66H18z"/><path d="M42 38a8 8 0 1 1 11 7c-3 1-3 3-3 5"/><circle cx="50" cy="58" r="1.5" fill="#C6F432"/>'),
 demo:S('<rect x="18" y="24" width="64" height="58" rx="10"/><path d="M18 42h64M36 16v14M64 16v14"/><path d="M38 62l9 9 17-17"/>'),
 who:S('<circle cx="36" cy="38" r="11"/><circle cx="66" cy="38" r="11"/><path d="M16 78c2-12 10-18 20-18s18 6 20 18M46 78c2-12 10-18 20-18s18 6 20 18"/>'),
 results:S('<path d="M18 80h66"/><rect x="24" y="54" width="12" height="20" rx="3"/><rect x="44" y="40" width="12" height="34" rx="3"/><rect x="64" y="24" width="12" height="50" rx="3"/>'),
};
const root=document.getElementById('root');
if(mode==='cover'){const keys=['how','faq','demo','who','results'];
 root.innerHTML=`<div class="cov"><div class="glass disc">${ICONS[keys[i-1]]}</div></div>`;}
else{
 const LOGO=`<svg viewBox="0 0 1080 1080" style="width:150px;height:150px;border-radius:50%;box-shadow:0 0 70px rgba(198,244,50,.4)">${window.LOGO}</svg>`;
 const foot=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:auto"><span class="foot">@slotback.app</span><span class="tag">📌 PINNED</span></div>`;
 const P={
 1:`${LOGO}<div class="kick" style="margin-top:60px">Meet SlotBack</div><h1>Every cancelled<br>slot, <span class="l">filled<br>again.</span></h1>
   <p class="p" style="max-width:820px">When a client cancels, your waitlist gets a claim link. The first to tap gets the slot. No calls, no chasing.</p>
   <div class="row" style="margin-top:50px;flex-wrap:wrap">${['Salons','Skin clinics','Physio','Lash &amp; nails'].map(t=>`<span class="glass" style="padding:18px 30px;border-radius:999px;font-weight:800;font-size:32px">${t}</span>`).join('')}</div>${foot}`,
 2:`<div class="kick">How it works</div><h2>3 steps.<br><span class="l">Zero phone calls.</span></h2>
   <div style="display:flex;flex-direction:column;gap:22px;margin-top:56px">${[['1','A client cancels','You mark the slot free. That\'s your only job.'],['2','Your waitlist gets a link','Everyone who wanted an earlier slot is notified at once.'],['3','First tap books it','The link expires, the slot is filled, and you get a ping.']].map(([n,t,d],k)=>`<div class="glass ${k==2?'lime':''}" style="display:flex;gap:34px;align-items:center;padding:36px 40px"><span style="font-family:AB;font-size:96px;line-height:1;${k==2?'':'color:var(--l)'}">${n}</span><div><div style="font-family:AB;font-size:46px;letter-spacing:-.02em">${t}</div><div style="font-weight:600;font-size:32px;margin-top:8px;opacity:.8">${d}</div></div></div>`).join('')}</div>
   <p class="p" style="font-size:34px">No app for your clients. Works next to your current booking system.</p>${foot}`,
 3:`<div class="kick">Now booking demos</div><h1>See it fill<br><span class="l">your diary.</span></h1>
   <div class="glass" style="padding:44px;margin-top:56px;display:flex;flex-direction:column;gap:22px">${['15-minute walkthrough','Set up with you, live in about 10 min','No commitment, just see it work'].map(t=>`<div style="display:flex;gap:22px;align-items:center;font-weight:800;font-size:38px"><span class="pill g" style="margin:0;font-size:30px">✓</span>${t}</div>`).join('')}</div>
   <div style="margin-top:56px"><span class="glass lime cta">DM “DEMO” to @slotback.app →</span></div>
   <div class="foot" style="margin-top:28px">or tap the link in our bio</div>${foot}`};
 root.innerHTML=`<div class="post"><div class="body" style="justify-content:flex-start">${P[i]}</div></div>`;}
</script></body></html>
