<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:AB;src:url(archivo-black-latin-400-normal.woff2)}
@font-face{font-family:AB;src:url(archivo-black-latin-ext-400-normal.woff2);unicode-range:U+20B9}
@font-face{font-family:IT;src:url(inter-tight-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:IT;src:url(inter-tight-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:IT;src:url(inter-tight-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:IT;src:url(inter-tight-latin-ext-500-normal.woff2);font-weight:500;unicode-range:U+20B9}
@font-face{font-family:IT;src:url(inter-tight-latin-ext-700-normal.woff2);font-weight:700;unicode-range:U+20B9}
@font-face{font-family:IT;src:url(inter-tight-latin-ext-800-normal.woff2);font-weight:800;unicode-range:U+20B9}
:root{--ink:#07140F;--g:#0F2E22;--gl:#1A4434;--l:#C6F432;--c:#F5EFE1;--m:#8FA89B;--red:#FF5A4A}
*{box-sizing:border-box;margin:0}
body{height:1350px;background:var(--ink);color:var(--c);font-family:IT,sans-serif;position:relative;overflow:hidden}
#bg{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(110px)}
.ring{position:absolute;border-radius:50%;border:3px solid rgba(198,244,50,.35);box-shadow:0 0 60px rgba(198,244,50,.25),inset 0 0 60px rgba(198,244,50,.15)}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),rgba(255,255,255,.08) 35%,rgba(198,244,50,.12) 70%,rgba(255,255,255,.04));border:1.5px solid rgba(255,255,255,.25);backdrop-filter:blur(12px);box-shadow:inset -20px -30px 60px rgba(7,20,15,.4),0 30px 60px rgba(0,0,0,.35)}
.noise{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.gridl{position:absolute;inset:0;background-image:linear-gradient(rgba(245,239,225,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(245,239,225,.05) 1px,transparent 1px);background-size:90px 90px;mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%)}
.slide{position:absolute;top:0;width:1080px;height:1350px;padding:96px 90px 90px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:28px;color:rgba(245,239,225,.75)}
.top .h{display:flex;align-items:center;gap:14px}.top img{width:48px;height:48px;border-radius:50%}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.03));backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border:1.5px solid rgba(255,255,255,.16);border-radius:44px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.05),0 40px 90px rgba(0,0,0,.4)}
.glass.lime{background:linear-gradient(135deg,rgba(214,255,90,.95),rgba(170,220,30,.82));color:var(--g);border-color:rgba(255,255,255,.5);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 0 90px rgba(198,244,50,.35),0 40px 90px rgba(0,0,0,.4)}
.glass.red{background:linear-gradient(135deg,rgba(255,90,74,.28),rgba(255,90,74,.08));border-color:rgba(255,120,100,.35)}
.pg{padding:12px 24px;border-radius:999px;font-size:26px;font-weight:800;letter-spacing:.06em}
.body{flex:1;display:flex;flex-direction:column;justify-content:center}
.kick{font-weight:800;font-size:30px;letter-spacing:.16em;color:var(--l);margin-bottom:28px;text-transform:uppercase}
h1{font-family:AB;font-weight:400;font-size:112px;line-height:.98;letter-spacing:-.045em}
h2{font-family:AB;font-weight:400;font-size:84px;line-height:1.02;letter-spacing:-.04em}
h3{font-family:AB;font-weight:400;font-size:54px;line-height:1.08;letter-spacing:-.03em}
.l{color:var(--l);text-shadow:0 0 50px rgba(198,244,50,.45)}
.p{font-weight:500;font-size:40px;line-height:1.35;color:rgba(245,239,225,.82);margin-top:30px}
.sw{display:flex;align-items:center;gap:18px;font-weight:800;font-size:34px;color:var(--l)}
.sw b{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px}
.row{display:flex;gap:22px}
.item{display:flex;align-items:center;gap:28px;padding:30px 36px;font-weight:800;font-size:42px}
.ico{flex:none;width:76px;height:76px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:40px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
.big{font-family:AB;font-size:230px;letter-spacing:-.06em;line-height:.95}
.tag{display:inline-block;font-weight:800;font-size:26px;letter-spacing:.12em;padding:10px 22px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:rgba(245,239,225,.8)}
.rank{font-family:AB;font-size:300px;line-height:.8;letter-spacing:-.06em;-webkit-text-stroke:3px rgba(198,244,50,.7);color:transparent;text-shadow:0 0 60px rgba(198,244,50,.25)}
.meter{display:flex;gap:10px;margin-top:22px}.meter i{flex:1;height:18px;border-radius:9px;background:rgba(255,255,255,.12)}.meter i.on{background:var(--l);box-shadow:0 0 20px rgba(198,244,50,.6)}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:34px}
.pc>div{padding:34px;font-weight:700;font-size:34px;line-height:1.3}
.pc b{display:block;font-weight:800;font-size:24px;letter-spacing:.14em;margin-bottom:12px}
.strike{position:relative;display:inline-block}.strike:after{content:"";position:absolute;left:-4%;right:-4%;top:52%;height:12px;background:var(--red);border-radius:6px;transform:rotate(-6deg);box-shadow:0 0 30px rgba(255,90,74,.6)}
.flow{display:flex;align-items:center;gap:16px}
.flow .st{flex:1;padding:34px 20px;text-align:center;font-weight:800;font-size:34px}
.flow .ar{font-family:AB;font-size:44px;color:var(--l)}
.cta{display:inline-flex;align-items:center;gap:20px;padding:32px 48px;border-radius:999px;font-weight:800;font-size:44px}
.foot{font-weight:700;font-size:28px;color:rgba(245,239,225,.6)}
.myth{font-family:AB;font-size:70px;line-height:1.05;letter-spacing:-.03em;color:rgba(245,239,225,.6)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.split>div{padding:40px 34px}
.phone{padding:34px}
.phone .mt{font-weight:700;font-size:26px;opacity:.6}.phone .tt{font-family:AB;font-size:46px;line-height:1.1;margin-top:10px}
.pill{display:inline-block;margin-top:18px;font-weight:800;font-size:26px;padding:8px 20px;border-radius:999px}
.pill.r{background:var(--red);color:#fff}.pill.g{background:var(--l);color:var(--g)}
.bub{padding:34px 40px;border-radius:40px 40px 40px 10px;font-weight:600;font-size:36px;line-height:1.38;background:linear-gradient(135deg,rgba(26,68,52,.92),rgba(15,46,34,.85));border:1.5px solid rgba(198,244,50,.3);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.18),0 30px 70px rgba(0,0,0,.4)}
.bub small{display:block;margin-top:14px;font-size:24px;font-weight:700;color:rgba(245,239,225,.5);text-align:right}
.num{font-family:AB;font-size:44px;color:var(--g);background:var(--l);width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 40px rgba(198,244,50,.5)}
</style><script src="logo.js"></script><script src="carousels.js"></script></head><body><div id="bg"></div><div id="slides"></div>
<script>
const q=new URLSearchParams(location.search);const C=CAROUSELS[(+q.get('c')||1)-1];const N=C.slides.length;
document.body.style.width=N*1080+'px';
const bg=document.getElementById('bg');
// seamless panorama background: blobs, rings and orbs span slide boundaries
const seed=C.seed||1;let r=seed*9301;const rnd=()=>((r=(r*9301+49297)%233280)/233280);
let h='<div class="gridl"></div>';
for(let i=0;i<N*2+2;i++){const x=i*540+rnd()*300-150,y=rnd()*1350-200,s=500+rnd()*500;
  const col=['rgba(198,244,50,.42)','rgba(26,68,52,.95)','rgba(40,120,80,.6)','rgba(198,244,50,.25)','rgba(15,80,60,.8)'][Math.floor(rnd()*5)];
  h+=`<div class="blob" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${col}"></div>`}
(C.rings||[]).forEach(([x,y,s])=>h+=`<div class="ring" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px"></div>`);
(C.orbs||[]).forEach(([x,y,s])=>h+=`<div class="orb" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px"></div>`);
h+='<div class="noise"></div>';bg.innerHTML=h;
const topbar=(i)=>`<div class="top"><span class="h"><img src="logo-B.svg">@slotback.app</span><span class="glass pg">${i+1} / ${N}</span></div>`;
document.getElementById('slides').innerHTML=C.slides.map((s,i)=>`<section class="slide" style="left:${i*1080}px">${topbar(i)}<div class="body">${s}</div></section>`).join('');
window.N=N;
</script></body></html>
