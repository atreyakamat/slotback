<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:AB;src:url(archivo-black-latin-400-normal.woff2)}
@font-face{font-family:AB;src:url(archivo-black-latin-ext-400-normal.woff2);unicode-range:U+20B9}
@font-face{font-family:IT;src:url(inter-tight-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:IT;src:url(inter-tight-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:IT;src:url(inter-tight-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:IT;src:url(inter-tight-latin-ext-500-normal.woff2);font-weight:500;unicode-range:U+20B9}
@font-face{font-family:IT;src:url(inter-tight-latin-ext-800-normal.woff2);font-weight:800;unicode-range:U+20B9}
:root{--ink:#07140F;--g:#0F2E22;--l:#C6F432;--c:#F5EFE1;--red:#FF5A4A}
*{box-sizing:border-box;margin:0}
body{background:var(--ink);color:var(--c);font-family:IT,sans-serif;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px)}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(198,244,50,.35);box-shadow:0 0 40px rgba(198,244,50,.25)}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),rgba(255,255,255,.08) 35%,rgba(198,244,50,.12) 70%,rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.25);box-shadow:inset -12px -18px 40px rgba(7,20,15,.4),0 20px 40px rgba(0,0,0,.35)}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.03));backdrop-filter:blur(20px) saturate(170%);border:1px solid rgba(255,255,255,.18);border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 24px 50px rgba(0,0,0,.4)}
.glass.lime{background:linear-gradient(135deg,rgba(214,255,90,.96),rgba(170,220,30,.86));color:var(--g);border-color:rgba(255,255,255,.5);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 0 60px rgba(198,244,50,.3)}
.page{position:relative;z-index:1;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;font-family:AB;font-size:26px;letter-spacing:-.02em}
.brand svg{width:46px;height:46px;border-radius:50%}
.kick{font-weight:800;font-size:15px;letter-spacing:.18em;color:var(--l);text-transform:uppercase}
h1{font-family:AB;font-weight:400;letter-spacing:-.045em;line-height:.98}
.l{color:var(--l);text-shadow:0 0 30px rgba(198,244,50,.45)}
.p{font-weight:500;line-height:1.4;color:rgba(245,239,225,.85)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.steps>div{padding:18px 16px}
.n{font-family:AB;font-size:15px;width:34px;height:34px;border-radius:50%;background:var(--l);color:var(--g);display:flex;align-items:center;justify-content:center}
.steps b{display:block;margin-top:12px;font-weight:800;font-size:19px;line-height:1.2}
.steps span{display:block;margin-top:6px;font-size:14px;font-weight:500;color:rgba(245,239,225,.7);line-height:1.35}
.qr{background:var(--c);border-radius:20px;padding:14px;flex:none}
.qr img{display:block}
.math{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px}
.math .big{font-family:AB;font-size:52px;letter-spacing:-.04em;line-height:1}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
</style><script src="logo.js"></script></head><body><div id="bg"></div><div id="root"></div>
<script>
const P=new URLSearchParams(location.search).get('p')||'flyer';
const logo=`<svg viewBox="0 0 1080 1080">${window.LOGO}</svg>`;
const brand=`<div class="brand">${logo}SlotBack</div>`;
const qr=s=>`<div class="qr"><img src="qr-ig.svg" style="width:${s}px;height:${s}px"></div>`;
const bg=(W,H,items)=>items.map(([t,x,y,s,c])=>t==='b'?`<div class="blob" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${c}"></div>`:t==='r'?`<div class="ring" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px"></div>`:`<div class="orb" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px"></div>`).join('')+`<div style="position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay;background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>&quot;)"></div>`;
let W,H,html,deco;
if(P==='flyer'){W=874;H=1240;
deco=bg(W,H,[['b',-160,-140,520,'rgba(198,244,50,.35)'],['b',520,380,520,'rgba(26,110,72,.75)'],['b',-120,900,460,'rgba(198,244,50,.2)'],['r',470,-120,520],['r',-260,700,560],['o',700,560,120],['o',60,640,70]]);
html=`<div class="page" style="width:${W}px;height:${H}px;padding:56px 58px 50px;gap:30px">
<div style="display:flex;justify-content:space-between;align-items:center">${brand}<span class="kick" style="color:rgba(245,239,225,.6)">Made in Goa</span></div>
<div style="margin-top:14px"><div class="kick">For salons, clinics &amp; studios</div>
<h1 style="font-size:84px;margin-top:16px">Someone just<br>cancelled<br><span class="l">at 4 PM.</span></h1>
<p class="p" style="font-size:22px;margin-top:20px;max-width:640px">Who's taking that slot? SlotBack sends your waitlist a claim link the moment a client cancels. The first to tap gets it.</p></div>
<div class="steps">${[["Client cancels","You mark the slot free, or it's caught automatically."],["Waitlist gets a link","Everyone who wanted an earlier time hears at once."],["First tap books it","No calls, no chasing, no double-booking."]].map(([b,s],i)=>`<div class="glass ${i==2?'':''}"><div class="n">${i+1}</div><b>${b}</b><span>${s}</span></div>`).join('')}</div>
<div class="glass math"><div><div class="kick" style="color:rgba(245,239,225,.6)">One ₹1,000 cancel a day</div><div class="p" style="font-size:17px;margin-top:6px">× 26 working days. Example numbers.</div></div><div class="big l">₹26,000<span style="font-size:20px;color:rgba(245,239,225,.7);letter-spacing:0;font-family:IT;font-weight:700"> /month lost</span></div></div>
<div class="glass lime" style="display:flex;align-items:center;gap:26px;padding:24px;margin-top:auto">${qr(170)}
<div><div style="font-weight:800;font-size:14px;letter-spacing:.16em">SCAN · FREE DEMO</div><div style="font-family:AB;font-size:38px;letter-spacing:-.03em;line-height:1.05;margin-top:8px">DM “DEMO” to<br>@slotback.app</div><div style="font-weight:700;font-size:15px;margin-top:10px">Free cancellation toolkit included. Paid pilot only if it works for you.</div></div></div>
<div class="tags"><span>Hair &amp; beauty</span><span>Skin &amp; aesthetics</span><span>Physio</span><span>Nails &amp; lashes</span><span>Dental</span><span>Fitness</span></div>
</div>`;}
else{W=620;H=874;
deco=bg(W,H,[['b',-140,-120,420,'rgba(198,244,50,.35)'],['b',300,420,420,'rgba(26,110,72,.75)'],['r',330,-100,380],['o',500,330,80]]);
html=`<div class="page" style="width:${W}px;height:${H}px;padding:44px 44px 40px;gap:22px;align-items:center;text-align:center">
${brand}
<div style="margin-top:10px"><div class="kick">Free for your business</div>
<h1 style="font-size:58px;margin-top:14px">Lost a slot<br>to a <span class="l">cancel?</span></h1>
<p class="p" style="font-size:18px;margin-top:14px">Get the free Empty Slot Rescue Kit: a cost calculator, copy-paste messages and a fair cancellation policy.</p></div>
<div class="glass" style="padding:20px;margin-top:6px">${qr(210)}</div>
<div style="font-family:AB;font-size:28px;letter-spacing:-.02em">Scan · DM “KIT”</div>
<div class="p" style="font-size:15px;margin-top:-12px">@slotback.app on Instagram</div>
<div class="glass lime" style="margin-top:auto;padding:14px 26px;border-radius:999px;font-weight:800;font-size:16px">SlotBack refills cancelled slots automatically</div>
</div>`;}
document.body.style.width=W+'px';document.body.style.height=H+'px';
document.getElementById('bg').innerHTML=deco;document.getElementById('bg').style.cssText='position:absolute;inset:0;overflow:hidden';
document.getElementById('root').innerHTML=html;window.SIZE=[W,H];
</script></body></html>
