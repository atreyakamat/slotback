<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:AB;src:url(../../../brand/source/archivo-black-latin-400-normal.woff2)}
@font-face{font-family:AB;src:url(../../../brand/source/archivo-black-latin-ext-400-normal.woff2);unicode-range:U+20B9}
@font-face{font-family:IT;src:url(../../../brand/source/inter-tight-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:IT;src:url(../../../brand/source/inter-tight-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:IT;src:url(../../../brand/source/inter-tight-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:IT;src:url(../../../brand/source/inter-tight-latin-ext-500-normal.woff2);font-weight:500;unicode-range:U+20B9}
@font-face{font-family:IT;src:url(../../../brand/source/inter-tight-latin-ext-700-normal.woff2);font-weight:700;unicode-range:U+20B9}
@font-face{font-family:IT;src:url(../../../brand/source/inter-tight-latin-ext-800-normal.woff2);font-weight:800;unicode-range:U+20B9}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:IT,sans-serif;position:relative}
/* theme tokens */
.green{--bg:#0F2E22;--fg:#F5EFE1;--acc:#C6F432;--card:#1A4434;--mut:#8FA89B;--line:rgba(198,244,50,.25);--onacc:#0F2E22}
.ink{--bg:#07140F;--fg:#F5EFE1;--acc:#C6F432;--card:#12271E;--mut:#8FA89B;--line:rgba(198,244,50,.2);--onacc:#0F2E22}
.cream{--bg:#F5EFE1;--fg:#0F2E22;--acc:#0F2E22;--card:#EAE2CF;--mut:#5E7469;--line:rgba(15,46,34,.18);--onacc:#C6F432;--hl:#C6F432}
.lime{--bg:#C6F432;--fg:#0F2E22;--acc:#0F2E22;--card:#B4E021;--mut:#3D5C2E;--line:rgba(15,46,34,.25);--onacc:#C6F432;--hl:#F5EFE1}
body{background:var(--bg);color:var(--fg)}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:120px 120px;opacity:.35}
.safe{position:absolute;left:80px;right:80px;top:260px;bottom:360px;display:flex;flex-direction:column;align-items:center;text-align:center}
.pill{border:3px solid var(--acc);color:var(--acc);font-weight:800;font-size:30px;letter-spacing:.12em;padding:12px 28px;border-radius:999px;white-space:nowrap}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.foot{display:flex;align-items:center;gap:16px;font-family:AB;font-size:40px;letter-spacing:-.02em}
.foot img{width:64px;height:64px;border-radius:50%}
.foot .b{color:var(--acc)}
.cream .foot .b,.lime .foot .b{color:var(--fg)}
h1{font-family:AB;font-weight:400;font-size:96px;line-height:1.02;letter-spacing:-.035em}
h1.m{font-size:80px}
em{font-style:normal;color:var(--acc)}
.cream em,.lime em{background:var(--hl);color:#0F2E22;padding:0 .12em;border-radius:.12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sub{font-weight:500;font-size:40px;line-height:1.3;opacity:.85;margin-top:36px;max-width:860px}
.hint{font-weight:800;font-size:34px;color:var(--mut);letter-spacing:.02em;margin-top:40px}
.sticker{width:100%;height:300px;margin-top:20px;border-radius:40px;border:4px dashed transparent}
.biglogo{width:400px;height:400px;border-radius:50%;margin-bottom:60px;box-shadow:0 0 0 10px var(--bg),0 0 0 18px var(--acc)}
.stat .label{font-weight:800;font-size:44px;color:var(--mut)}
.stat .big{font-family:AB;font-size:250px;letter-spacing:-.05em;line-height:1;color:var(--acc);margin:20px 0}
.cream .stat .big,.lime .stat .big{color:var(--fg)}
.stat .sub{margin-top:0;font-weight:700;font-size:50px;opacity:1}
.stat .footnote{font-weight:500;font-size:34px;color:var(--mut);margin-top:40px}
.rows{width:100%;margin-top:56px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:28px;background:var(--card);border-radius:28px;padding:28px 34px;font-weight:800;font-size:44px;text-align:left}
.ic{flex:none;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:AB;font-size:34px}
.ic.x{background:#FF4D3D;color:#fff}
.ic.v{background:var(--acc);color:var(--onacc)}
.vs{display:flex;gap:24px;width:100%;align-items:stretch;position:relative;margin-top:50px}
.vs .c{flex:1;border-radius:36px;padding:70px 26px;background:var(--card)}
.vs .c b{display:block;font-family:AB;font-weight:400;font-size:60px;line-height:1.05;letter-spacing:-.02em}
.vs .c span{display:block;font-weight:700;font-size:36px;margin-top:20px;color:var(--mut)}
.vs .c.win{background:#0F2E22;color:#F5EFE1}.vs .c.win span{color:#C6F432}
.vs .chip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:110px;height:110px;border-radius:50%;background:#C6F432;color:#0F2E22;font-family:AB;font-size:44px;display:flex;align-items:center;justify-content:center;border:8px solid var(--bg)}
.mf{width:100%;display:flex;flex-direction:column;gap:30px}
.mf .box{border-radius:36px;padding:44px 44px;text-align:left}
.mf .t{font-weight:800;font-size:32px;letter-spacing:.14em}
.mf .myth{background:var(--card)}.mf .myth .t{color:#FF4D3D}
.mf .myth p{font-family:AB;font-size:64px;line-height:1.08;margin-top:16px;text-decoration:line-through;text-decoration-color:#FF4D3D;text-decoration-thickness:8px;opacity:.75}
.mf .fact{background:#C6F432;color:#0F2E22}
.mf .fact p{font-family:AB;font-size:58px;line-height:1.1;margin-top:16px}
/* phone cards */
.mock{width:820px;margin-top:56px;border-radius:44px;background:#F5EFE1;color:#0F2E22;padding:44px;text-align:left;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.cream .mock{background:#fff}
.lime .mock{background:#0F2E22;color:#F5EFE1}
.mock .meta{font-weight:700;font-size:30px;opacity:.6}
.mock .ttl{font-family:AB;font-size:58px;line-height:1.1;margin-top:10px;letter-spacing:-.02em}
.mock .tag{display:inline-block;margin-top:24px;font-weight:800;font-size:32px;padding:10px 24px;border-radius:999px}
.tag.red{background:#FF4D3D;color:#fff}
.tag.ok{background:#C6F432;color:#0F2E22}
.bubble{background:#0F2E22;color:#F5EFE1;border-radius:34px 34px 34px 8px;padding:34px;font-weight:500;font-size:36px;line-height:1.35}
.bubble u{color:#C6F432;text-decoration:none;font-weight:800}
.btn{margin-top:30px;background:#0F2E22;color:#C6F432;font-weight:800;font-size:44px;border-radius:999px;padding:26px;text-align:center}
.timer{display:flex;justify-content:space-between;align-items:center;margin-top:26px;font-weight:800;font-size:34px}
.timer b{font-family:AB;font-weight:400;font-size:46px;color:#FF4D3D}
.cd .big{font-family:AB;font-size:420px;line-height:.9;letter-spacing:-.06em;color:var(--acc)}
.cd .big.w{font-size:260px}
.cream .cd .big,.lime .cd .big{color:var(--fg)}
.cd .unit{font-family:AB;font-size:110px;letter-spacing:-.03em;margin-top:10px}
.faq .q{align-self:flex-end;max-width:820px;background:var(--card);border-radius:44px 44px 10px 44px;padding:44px;text-align:left;font-family:AB;font-size:62px;line-height:1.1;letter-spacing:-.02em}
.faq .a{align-self:flex-start;max-width:820px;margin-top:40px;background:#C6F432;color:#0F2E22;border-radius:44px 44px 44px 10px;padding:44px;text-align:left;font-weight:700;font-size:46px;line-height:1.3}
.faq .from{display:flex;align-items:center;gap:14px;margin-bottom:18px;font-weight:800;font-size:30px}
.faq .from img{width:52px;height:52px;border-radius:50%}
.cta{margin-top:60px;background:var(--acc);color:var(--onacc);font-weight:800;font-size:50px;padding:32px 64px;border-radius:999px;box-shadow:0 0 70px rgba(198,244,50,.4)}
body.guides:after{content:"";position:absolute;left:0;right:0;top:0;height:250px;background:rgba(255,0,0,.3);box-shadow:0 1670px 0 0 rgba(255,0,0,.3)}
body.guides .safe{outline:3px dashed red}

.a{will-change:transform,opacity}
.k{font-family:AB;font-size:120px;line-height:1.02;letter-spacing:-.04em;display:block}
.k.acc{color:var(--acc)}
.cream .k.acc,.lime .k.acc{color:var(--fg)}
.cream .k.acc span,.lime .k.acc span{background:var(--hl);padding:0 .1em;border-radius:.1em}
.call{display:flex;align-items:center;gap:26px;background:var(--card);border-radius:28px;padding:26px 34px;font-weight:800;font-size:42px;width:100%;text-align:left}
.call .ph{width:70px;height:70px;border-radius:50%;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:36px}
.call .st{margin-left:auto;font-size:32px;color:#FF4D3D}
.cal{width:100%;margin-top:50px;background:var(--card);border-radius:40px;padding:22px;display:flex;flex-direction:column;gap:14px}
.slot{position:relative;display:flex;align-items:center;gap:26px;border-radius:24px;padding:26px 30px;background:var(--bg);text-align:left;overflow:hidden}
.slot .tm{font-family:AB;font-size:40px;width:130px}
.slot .nm{font-weight:800;font-size:38px;position:relative}
.slot .tg{margin-left:auto;font-weight:800;font-size:26px;padding:8px 18px;border-radius:999px;position:relative}
.slot .sweep{position:absolute;inset:0;background:#C6F432;transform-origin:left;transform:scaleX(0)}
.slot.filled{color:#0F2E22}
.bigc{font-family:AB;font-size:210px;letter-spacing:-.05em;line-height:1;color:var(--acc);margin:24px 0}
.cream .bigc,.lime .bigc{color:var(--fg)}
.chat{width:100%;margin-top:50px;display:flex;flex-direction:column;gap:24px}
.bb{max-width:800px;border-radius:40px;padding:34px 40px;font-weight:600;font-size:44px;line-height:1.3;text-align:left}
.bb.us{align-self:flex-start;background:#0F2E22;color:#F5EFE1;border-bottom-left-radius:8px}
.green .bb.us,.ink .bb.us{background:#F5EFE1;color:#0F2E22}
.bb.them{align-self:flex-end;background:#C6F432;color:#0F2E22;border-bottom-right-radius:8px}
.lime .bb.them{background:#F5EFE1}
.dots{display:inline-flex;gap:12px}.dots i{width:18px;height:18px;border-radius:50%;background:currentColor;opacity:.5}
.bbtn{align-self:flex-start;background:#C6F432;color:#0F2E22;font-weight:800;font-size:44px;border-radius:999px;padding:24px 48px}
.cream .bbtn,.lime .bbtn{background:#0F2E22;color:#C6F432}
.tcard{width:820px;margin-top:56px;border-radius:44px;background:#F5EFE1;color:#0F2E22;padding:50px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.tcard .ttl{font-family:AB;font-size:60px}
.tcard .tt{display:flex;justify-content:space-between;align-items:center;margin-top:24px;font-weight:800;font-size:38px}
.tcard .tt b{font-family:AB;font-weight:400;font-size:72px;color:#FF4D3D;font-variant-numeric:tabular-nums}
.tcard .bar{height:16px;border-radius:9px;background:#E3DCCB;margin-top:24px;overflow:hidden}.tcard .bar i{display:block;height:100%;background:#FF4D3D;transform-origin:left}
.stamp{position:absolute;left:50%;top:50%;font-family:AB;font-size:88px;color:#0F2E22;background:#C6F432;padding:18px 40px;border-radius:24px;white-space:nowrap;border:8px solid #0F2E22}
.nt{width:100%;display:flex;align-items:center;gap:26px;background:#F5EFE1;color:#0F2E22;border-radius:36px;padding:28px 32px;text-align:left;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.nt img{width:84px;height:84px;border-radius:22px}
.nt .t1{font-weight:700;font-size:28px;opacity:.6}.nt .t2{font-weight:800;font-size:42px}
.nt .ck{margin-left:auto;width:64px;height:64px;border-radius:50%;background:#C6F432;display:flex;align-items:center;justify-content:center;font-family:AB;font-size:34px}
.chipw{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin-top:56px}
.chip2{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:22px 38px;font-weight:800;font-size:42px}
.cdn{font-family:AB;font-size:520px;line-height:1;letter-spacing:-.06em;color:var(--acc);position:absolute;left:0;right:0;top:50%;text-align:center}
.vlogo{width:440px;height:440px;border-radius:50%;margin-bottom:60px}
.vsc{flex:1;border-radius:36px;padding:70px 26px;background:var(--card);position:relative}
.vsc b{display:block;font-weight:800;font-size:36px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.vsc span{display:block;font-family:AB;font-size:66px;line-height:1.05;letter-spacing:-.02em;margin-top:20px}
.vsc.win{background:#C6F432;color:#0F2E22}.vsc.win b{color:#3D5C2E}
.xline{position:absolute;left:8%;right:8%;top:50%;height:12px;background:#FF4D3D;border-radius:6px;transform-origin:left}
</style><script src="videos.js"></script><script src="logo.js"></script></head><body>
<div class="grid"></div>
<div class="safe"><div class="pill a" id="kicker"></div><div class="main" id="main" style="position:relative"></div>
<div class="foot a" id="foot"><img src="../../../brand/slotback-logo.svg"><span>Slot<span class="b">Back</span></span></div></div>
<script src="engine.js"></script></body></html>
