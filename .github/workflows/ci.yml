name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: slotback
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only values; never real credentials.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/slotback
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/slotback
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/slotback
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      DEMO_MODE: "true"
      AUTH_EMAIL_PROVIDER: dev-insecure
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate schema and migrations
        run: |
          pnpm prisma validate
          pnpm db:deploy
          pnpm prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit and database tests (includes the attack suite in tests/security)
        run: pnpm test
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests (includes the browser attack suite in e2e/security.spec.ts)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      # No cache: this job never installs, so there is no pnpm store to save.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Known vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Secrets committed to the repository
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
