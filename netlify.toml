# Netlify detects Next.js and applies its runtime automatically.
# Required environment variables (set in Netlify > Site configuration > Environment variables):
#   DATABASE_URL, DIRECT_URL, SESSION_SECRET, NEXT_PUBLIC_APP_URL, DEMO_MODE, CRON_SECRET, MESSAGE_PROVIDER
# See .env.example and docs/DEPLOYMENT.md.

[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Only production deploys apply database migrations. Deploy previews never change the schema.
[context.production]
  command = "pnpm db:deploy && pnpm build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
