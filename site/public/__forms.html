<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="robots" content="noindex" /><title>Forms</title></head>
  <body>
    <!-- Netlify reads this file at deploy time to register the demo form. The page posts to it with fetch. -->
    <form name="demo" data-netlify="true" netlify-honeypot="company_site" hidden>
      <input type="hidden" name="form-name" value="demo" />
      <input name="name" />
      <input name="business" />
      <input name="whatsapp" />
      <input name="type" />
      <input name="city" />
      <input name="company_site" />
    </form>
  </body>
</html>
